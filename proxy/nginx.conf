# Send nginx logs to the container's stdout/stderr so that
# `docker compose logs proxy` shows them on any base image.
error_log /dev/stderr warn;

# Bonus: running as a non-root user (see Dockerfile) means nginx can't
# write its default pid file under /var/run. /tmp is writable by
# everyone, so point it there instead.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # Compose gives each service a DNS name matching its name in
    # docker-compose.yml. 127.0.0.1 here would mean "this proxy
    # container," not the backend, so it has to be the service name.
    upstream app_backend {
        server backend:8080;
    }

    server {
        # Bonus: unprivileged port, so the non-root user in the
        # Dockerfile can bind it without needing root/capabilities.
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /nginx-health {
            default_type application/json;
            return 200 '{"proxy": "ok"}';
        }
    }
}
